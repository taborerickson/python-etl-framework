[build-system] 
requires = ["setuptools>=68", "wheel"] 
build-backend = "setuptools.build_meta" 

[project] 
name = "etl-framework" 
version = "0.1.0"
description = "Reusable Python ETL framework for the Sales Intelligence Pipeline"  
authors = [{ name = "Tabor Erickson", email = "taborerickson1@gmail.com" }]
requires-python = ">=3.11" 
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
    "requests>=2.31",
]

[project.optional-dependencies] 
dev = [
    "pytest>=8.0", 
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"] 

[tool.ruff] 
line-length = 88

[tool.ruff.lint] 
select = ["E", "F", "I"] 
