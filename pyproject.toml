[build-system] 
requires = ["setuptools>=68", "wheel"] 
build-backend = "setuptools.build_meta" 

[project] 
name = "etl-framework" 
version = "0.1.0"
description = "Reusable Python ETL framework for the Sales Intelligence Pipeline"  
authors = [{ name = "Tabor Erickson", email = "taborerickson1@gmail.com" }]
requires-python = ">=3.11" 
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.optional-dependencies] 
dev = [
    "pytest>=8.0", 
    "pytest-cov",
    "ruff", 
    "responses>=0.25", 
]

[tool.setuptools.packages.find]
include = ["etl_framework*"] 

[tool.pytest.ini_options]
testpaths = ["tests"] 
addopts = "-ra --strict-markers"

[tool.ruff] 
line-length = 88

[tool.ruff.lint] 
select = ["E", "F", "I"] 
ignore = ["E501"]

[tool.coverage.run]
source = ["etl_framework"] 
branch = true 

[tool.coverage.report] 
show_missing = true 
exclude_lines = [
    "pragma: no cover", 
    "if TYPE_CHECKING:", 
    "raise NotImplementedError", 
    "if __name__ == .__main__.:",
]
